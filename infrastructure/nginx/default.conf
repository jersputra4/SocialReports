# Reverse proxy zona Public/DMZ.
# Satu-satunya komponen yang terbuka ke internet (BRD 3.2).

# Rate limit kasar di tepi; rate limit per akun ada di aplikasi (NFR-09).
limit_req_zone $binary_remote_addr zone=edge_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=edge_auth:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    # ------------------------------------------------------------------
    # Resolusi nama kontainer per permintaan.
    #
    # Blok `upstream` meresolusi nama hanya sekali, saat nginx start. Begitu
    # kontainer api atau frontend direkreasi, alamat IP-nya berganti sementara
    # nginx masih memegang yang lama, dan seluruh situs menjawab 502 sampai
    # nginx ikut di-restart. Itu terjadi pada setiap deploy.
    #
    # 127.0.0.11 adalah DNS internal Docker. Dengan alamat upstream disimpan
    # di variabel, nginx meresolusi ulang nama itu saat permintaan datang,
    # bukan saat start, sehingga rekreasi kontainer tidak lagi memutus situs.
    #
    # Harga yang dibayar: koneksi keepalive ke upstream hilang, karena blok
    # `upstream` tidak lagi dipakai. Pada skala ini biayanya jauh lebih kecil
    # daripada situs mati tiap kali deploy.
    # ------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "api:3000";
    set $frontend_upstream "frontend:80";

    # Header keamanan dasar. HSTS ditambahkan pada terminator TLS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Kotak surat pengembangan tidak boleh terjangkau dari internet.
    location ^~ /api/v1/dev/ {
        return 404;
    }

    # Webhook pembayaran: tanpa rate limit ketat, gateway dapat melakukan burst.
    location /api/v1/webhooks/ {
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location ~ ^/api/v1/auth/(login|register|mfa|password-reset) {
        limit_req zone=edge_auth burst=10 nodelay;
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/ {
        limit_req zone=edge_general burst=40 nodelay;
        proxy_pass http://$api_upstream$request_uri;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location / {
        proxy_pass http://$frontend_upstream$request_uri;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
