# Penyaji berkas statis hasil build Vite.
# Proxy ke API dilakukan reverse proxy di depan (infrastructure/nginx).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Berkas dengan hash pada namanya aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplikasi satu halaman: seluruh rute dikembalikan ke index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        # CSP ketat: tidak ada skrip dari luar, gambar boleh dari object storage
        # lewat signed URL, koneksi hanya ke origin sendiri.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self' http: https:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}
