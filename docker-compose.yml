name: social-report-system

# Zona jaringan mengikuti BRD/SRS v1.1 bagian 3.2.
#   public    : hanya reverse proxy yang terbuka ke internet
#   app       : api + worker
#   data      : postgres, redis, object storage  -> hanya dari zona app
#   restricted: metadata fetcher + egress        -> TIDAK tersambung ke zona data
#   automation: n8n                              -> TIDAK tersambung ke zona data
networks:
  public:
  app:
  # Catatan: di lingkungan nyata zona `data` dijalankan dengan `internal: true`
  # dan tanpa published port. Untuk pengembangan lokal port sengaja dibuka agar
  # psql/redis-cli/konsol MinIO dapat dipakai dari mesin pengembang.
  data:
  restricted:
  automation:
    internal: true

volumes:
  pgdata:
  redisdata:
  miniodata:

services:
  # ----------------------------------------------------------------- zona data
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srs_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-social_report}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/bin/true
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srs} -d ${POSTGRES_DB:-social_report}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_local_password}"]
    volumes:
      - redisdata:/data
    networks: [data]
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_local_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-srs_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-srs_minio_password}
    volumes:
      - miniodata:/data
    networks: [data]
    ports:
      - "${MINIO_API_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    networks: [data]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-srs_minio_admin} ${S3_SECRET_KEY:-srs_minio_password} &&
      mc mb --ignore-existing local/${S3_BUCKET:-social-report} &&
      mc version enable local/${S3_BUCKET:-social-report} &&
      mc anonymous set none local/${S3_BUCKET:-social-report} &&
      echo 'bucket siap'
      "

  # ------------------------------------------------------------------ zona app
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["node", "dist/src/main.js"]
    env_file: [.env]
    environment:
      NODE_ROLE: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-srs}:${POSTGRES_PASSWORD:-srs_local_password}@postgres:5432/${POSTGRES_DB:-social_report}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      FETCHER_URL: http://fetcher:4001
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [app, data, restricted]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-srs}:${POSTGRES_PASSWORD:-srs_local_password}@postgres:5432/${POSTGRES_DB:-social_report}?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/prisma/seed.js"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    command: ["node", "dist/src/worker/main.js"]
    env_file: [.env]
    environment:
      NODE_ROLE: worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-srs}:${POSTGRES_PASSWORD:-srs_local_password}@postgres:5432/${POSTGRES_DB:-social_report}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_local_password}@redis:6379
      S3_ENDPOINT: http://minio:9000
      N8N_WEBHOOK_URL: http://automation:4002/webhook/report-events
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [app, data, automation]

  # ----------------------------------------------------- zona restricted egress
  # Satu-satunya komponen yang mengambil data dari URL target (BRD 4.2).
  # Tidak tersambung ke network `data`, jadi tidak bisa menyentuh DB/objek storage.
  fetcher:
    build:
      context: ./fetcher
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 4001
    networks: [restricted]

  # ----------------------------------------------------------- zona automation
  # Simulator n8n: memverifikasi HMAC, dedupe event_id, fan-out ke kanal admin.
  automation:
    build:
      context: ./automation
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 4002
    networks: [automation]

  # --------------------------------------------------------------- zona public
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    networks: [public]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx:/etc/nginx/conf.d:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - api
      - frontend
    networks: [public, app]
